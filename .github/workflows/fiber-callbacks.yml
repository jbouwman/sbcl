name: Darwin fiber callbacks

on: [push]

jobs:
  saved-callbacks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream release tags for version generation
        run: git fetch https://github.com/sbcl/sbcl.git 'refs/tags/sbcl*:refs/tags/sbcl*'
      - name: Install host SBCL
        run: brew install sbcl
      - name: Build the Epsilon runtime configuration
        env:
          SBCL_MAKE_JOBS: -j4
          SBCL_MAKE_TARGET_2_OPTIONS: --disable-ldb --disable-debugger
        run: ./make.sh --fancy --with-sb-fiber --without-gencgc --with-mark-region-gc --with-sb-local-heaps --xc-host='sbcl --lose-on-corruption --disable-ldb --dynamic-space-size 2GB --disable-debugger'
      - name: Exercise fibers and restored callback pages
        working-directory: tests
        run: ./run-tests.sh fiber.pure.lisp fiber-callback-core.test.sh
